server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 204; }
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://auth:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /gateway/health { proxy_pass http://gateway:8000/health; }
    location = /gateway/.well-known/oauth-protected-resource {
        proxy_pass http://gateway:8000/.well-known/oauth-protected-resource;
    }
    location ^~ /gateway/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
