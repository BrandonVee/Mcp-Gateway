server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 204; }
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://auth:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /gateway/health { proxy_pass http://gateway:8000/health; }
    location = /gateway/.well-known/oauth-protected-resource {
        proxy_pass http://gateway:8000/.well-known/oauth-protected-resource;
    }
    location ^~ /gateway/ { return 404; }
    # Vite emits content-hashed assets; missing chunks must not return SPA HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        gzip on;
    }
    # Revalidate the entry page so upgrades load the current asset filenames.
    location = /index.html {
        expires -1;
        gzip on;
    }
    location / {
        expires -1;
        gzip on;
        try_files $uri $uri/ /index.html;
    }
}
