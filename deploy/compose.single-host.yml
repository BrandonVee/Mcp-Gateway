# Single HTTP entry point; terminate HTTPS in your own host Nginx.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/deploy.sh first}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [control]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/deploy.sh first}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [control]

  auth:
    image: ${MCP_IMAGE_PREFIX:-}mcp-runtime:${MCP_VERSION:?run scripts/deploy.sh first}
    build:
      context: ..
      dockerfile: Dockerfile.production
      target: runtime
    command: ["node", "packages/auth-server/dist/index.js"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      SYSTEM_CONFIG_MODE: database
      CONFIG_FILE: /app/config/production.json
      DATABASE_URL: postgres://mcp:${POSTGRES_PASSWORD:?}@postgres:5432/mcp
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:?}
      CREDENTIAL_ENCRYPT_KEY: ${CREDENTIAL_ENCRYPT_KEY:?}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
    volumes:
      - ${MCP_DEPLOY_DIR:-./single-host}/config.json:/app/config/production.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [control]

  gateway:
    image: ${MCP_IMAGE_PREFIX:-}mcp-runtime:${MCP_VERSION:?}
    command: ["node", "packages/gateway/dist/index.js"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      SYSTEM_CONFIG_MODE: database
      CONFIG_FILE: /app/config/production.json
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:?}
    volumes:
      - ${MCP_DEPLOY_DIR:-./single-host}/config.json:/app/config/production.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      auth: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [control]

  admin-web:
    image: ${MCP_IMAGE_PREFIX:-}mcp-admin-web:${MCP_VERSION:?}
    build:
      context: ..
      dockerfile: Dockerfile.production
      target: admin-web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./nginx-single-host.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      auth: { condition: service_healthy }
      gateway: { condition: service_healthy }
    networks: [control]

volumes:
  postgres_data:
  redis_data:

networks:
  control:
