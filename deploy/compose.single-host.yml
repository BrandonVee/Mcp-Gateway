# Single HTTP entry point; terminate HTTPS in your own host Nginx.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/deploy.sh first}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [control]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/deploy.sh first}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [control]

  app:
    image: ${MCP_IMAGE_PREFIX:-}${MCP_IMAGE_NAME:-mcp-app}:${MCP_VERSION:?run scripts/deploy.sh first}
    build:
      context: ..
      dockerfile: Dockerfile.production
      target: app
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      SYSTEM_CONFIG_MODE: database
      CONFIG_FILE: /app/config/production.json
      DATABASE_URL: postgres://mcp:${POSTGRES_PASSWORD:?}@postgres:5432/mcp
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:?}
      CREDENTIAL_ENCRYPT_KEY: ${CREDENTIAL_ENCRYPT_KEY:?}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      UPSTREAM_MAX_ACTIVE_REQUESTS: ${UPSTREAM_MAX_ACTIVE_REQUESTS:-100}
    volumes:
      - ${MCP_DEPLOY_DIR:-./single-host}/config.json:/app/config/production.json:ro
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [control]

volumes:
  postgres_data:
  redis_data:

networks:
  control:
