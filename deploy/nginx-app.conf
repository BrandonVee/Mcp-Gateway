server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { proxy_pass http://127.0.0.1:9002; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /api/internal/ { return 404; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /gateway/health { proxy_pass http://127.0.0.1:8000/health; }
    location = /gateway/.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8000/.well-known/oauth-protected-resource;
    }
    location ^~ /gateway/ { return 404; }

    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /servers { proxy_pass http://127.0.0.1:8000; }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/(authorize(?:/.*)?|token|register|jwks\.json|oauth/.*|me/.*|admin(?:/.*)?|\.well-known/(?:oauth-authorization-server|openid-configuration))$ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
