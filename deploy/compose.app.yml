# Unified application with externally managed PostgreSQL and Redis.
services:
  mcp-server:
    image: ${MCP_IMAGE_PREFIX:-}${MCP_IMAGE_NAME:-mcp-app}:${MCP_VERSION:?set MCP_VERSION}
    build:
      context: ..
      dockerfile: Dockerfile.production
      target: app
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      SYSTEM_CONFIG_MODE: database
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:?set CREDENTIAL_BROKER_TOKEN}
      CREDENTIAL_ENCRYPT_KEY: ${CREDENTIAL_ENCRYPT_KEY:?set CREDENTIAL_ENCRYPT_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      UPSTREAM_MAX_ACTIVE_REQUESTS: ${UPSTREAM_MAX_ACTIVE_REQUESTS:-100}
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8080}:8080"
