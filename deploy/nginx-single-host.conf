# Docker DNS follows service IP changes after a restart or upgrade.
resolver 127.0.0.11 valid=2s ipv6=off;
upstream auth_backend {
    zone auth_backend 64k;
    server auth:9001 resolve;
}
upstream gateway_backend {
    zone gateway_backend 64k;
    server gateway:8000 resolve;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 204; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /api/internal/ { return 404; }

    location ^~ /api/ {
        proxy_pass http://auth_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /gateway/health { proxy_pass http://gateway_backend/health; }
    location = /gateway/.well-known/oauth-protected-resource {
        proxy_pass http://gateway_backend/.well-known/oauth-protected-resource;
    }
    location ^~ /gateway/ { return 404; }

    location ^~ /mcp/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /servers { proxy_pass http://gateway_backend; }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://gateway_backend;
    }
    location ~ ^/(authorize(?:/.*)?|token|register|jwks\.json|oauth/.*|me/.*|admin(?:/.*)?|\.well-known/(?:oauth-authorization-server|openid-configuration))$ {
        proxy_pass http://auth_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Vite emits content-hashed assets; missing chunks must not return SPA HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        gzip on;
    }
    # Revalidate the entry page so upgrades load the current asset filenames.
    location = /index.html {
        expires -1;
        gzip on;
    }
    location / {
        expires -1;
        gzip on;
        try_files $uri $uri/ /index.html;
    }
}
