services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: 'setup:pg@password/#12345'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "setup:redis@password/#12345"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='setup:redis@password/#12345' redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
  mcp-server:
    image: ${SETUP_TEST_IMAGE:-mcp-app:setup-test}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes: ["app_data:/app/data"]
    ports: ["127.0.0.1:${SETUP_TEST_PORT:-18081}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  app_data:
