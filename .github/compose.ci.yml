# Exercise the production runtime images, not source bind mounts or dev servers.
services:
  admin-web:
    image: mcp-admin-web:ci
    build:
      context: .
      dockerfile: Dockerfile.production
      target: admin-web
    command: !override []
    read_only: true
    tmpfs: ["/tmp"]
    ports: !override ["127.0.0.1:5173:8080"]
    volumes: !reset []
  auth:
    image: mcp-runtime:ci
    build:
      context: .
      dockerfile: Dockerfile.production
      target: runtime
    command: ["node", "packages/auth-server/dist/index.js"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes: !override ["./config:/app/config:ro"]
  gateway:
    image: mcp-runtime:ci
    build: !reset null
    command: ["node", "packages/gateway/dist/index.js"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes: !override ["./config:/app/config:ro"]
  mcp-a:
    image: mcp-runtime:ci
    build: !reset null
    command: ["node", "packages/mcp-server/dist/index.js"]
    volumes: !reset []
  mcp-b:
    image: mcp-runtime:ci
    build: !reset null
    command: ["node", "packages/mcp-server/dist/index.js"]
    volumes: !reset []
  mcp-reports:
    image: mcp-runtime:ci
    build: !reset null
    command: ["node", "packages/mcp-server/dist/index.js"]
    volumes: !reset []
  mcp-knowledge:
    image: mcp-runtime:ci
    build: !reset null
    command: ["node", "packages/mcp-server/dist/index.js"]
    volumes: !reset []
