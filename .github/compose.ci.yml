# Exercise the production runtime images, not source bind mounts or dev servers.
services:
  admin-web:
    image: mcp-admin-web:ci
    build:
      context: .
      dockerfile: Dockerfile.production
      target: admin-web
    command: !override []
    read_only: true
    tmpfs: ['/tmp']
    ports: !override ['127.0.0.1:5173:8080']
    volumes: !reset []
  auth:
    image: mcp-runtime:ci
    build:
      context: .
      dockerfile: Dockerfile.production
      target: runtime
    command: ['node', 'packages/auth-server/dist/index.js']
    read_only: true
    tmpfs: ['/tmp']
    volumes: !override ['./config:/app/config:ro']
  gateway:
    image: mcp-runtime:ci
    build: !reset null
    command: ['node', 'packages/gateway/dist/index.js']
    read_only: true
    tmpfs: ['/tmp']
    volumes: !override ['./config:/app/config:ro']
  mcp-a:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: test-upstream
    environment:
      MCP_SERVER_NAME: 'demo'
      MCP_INSTANCE_ID: 'demo-a'
      MCP_PORT: '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  mcp-b:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: test-upstream
    environment:
      MCP_SERVER_NAME: 'demo'
      MCP_INSTANCE_ID: 'demo-b'
      MCP_PORT: '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  mcp-reports:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: test-upstream
    environment:
      MCP_SERVER_NAME: 'reports'
      MCP_INSTANCE_ID: 'reports-a'
      MCP_PORT: '3003'
      MCP_DEMO_API_KEY: 'smoke-user-key'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  mcp-knowledge:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: test-upstream
    environment:
      MCP_SERVER_NAME: 'knowledge'
      MCP_INSTANCE_ID: 'knowledge-a'
      MCP_PORT: '3004'
