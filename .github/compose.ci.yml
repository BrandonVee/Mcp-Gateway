# Exercise files baked into the image, not source bind mounts or watch processes.
services:
  admin-web:
    command: pnpm --filter @mcp/admin-web preview --host 0.0.0.0 --port 5173
    volumes: !reset []
  auth:
    command: pnpm --filter @mcp/auth-server start
    volumes: !reset []
  gateway:
    command: pnpm --filter @mcp/gateway start
    volumes: !reset []
  mcp-a:
    command: pnpm --filter @mcp/mcp-server start
    volumes: !reset []
  mcp-b:
    command: pnpm --filter @mcp/mcp-server start
    volumes: !reset []
  mcp-reports:
    command: pnpm --filter @mcp/mcp-server start
    volumes: !reset []
  mcp-knowledge:
    command: pnpm --filter @mcp/mcp-server start
    volumes: !reset []
