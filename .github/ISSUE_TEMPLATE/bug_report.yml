name: 问题反馈 / Bug report
description: 提供复现步骤，帮助定位问题。
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请通过 [私密漏洞报告](https://github.com/BrandonVee/Mcp-Gateway/security/advisories/new) 提交。
        请勿包含密码、令牌、数据库连接凭据或用户个人信息。
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: 发布版本、镜像标签或提交号
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 部署方式、操作系统、CPU 架构、MCP 客户端及版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图 / Redacted logs or screenshots
