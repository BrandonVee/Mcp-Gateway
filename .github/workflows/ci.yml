name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:admin
      - run: pnpm build:runtime
      - run: pnpm audit --prod --audit-level high

  single-host:
    needs: verify
    # Deployment rehearsals belong to the full regression suite.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mcp-setup-ci
      MCP_DEPLOY_DIR: /tmp/mcp-single-host
      MCP_HTTP_PORT: '18080'
      ADMIN_PASSWORD: ci-system-admin-password-123456
      # Build the checked-out commit instead of pulling the published image.
      MCP_IMAGE_PREFIX: ''
      MCP_IMAGE_NAME: mcp-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Deploy without a public URL or database configuration
        run: ./scripts/deploy.sh --yes
      - name: Verify setup, OAuth and persistent settings
        run: pnpm exec tsx scripts/smoke-system-settings.ts
      - name: Verify updater socket permissions and persistent logs
        run: UPDATER_TEST_IMAGE="mcp-app:$(git rev-parse --short=12 HEAD)" pnpm exec tsx scripts/smoke-updater-runtime.ts
      - name: Verify first-run browser database setup
        run: SETUP_TEST_IMAGE="mcp-app:$(git rev-parse --short=12 HEAD)" pnpm exec tsx scripts/smoke-web-setup.ts
      - name: Verify unified process lifecycle
        run: pnpm exec tsx scripts/smoke-app-lifecycle.ts
      - name: Rehearse backup and restore
        run: pnpm exec tsx scripts/smoke-backup.ts
      - name: Rehearse upgrade from split application containers
        run: pnpm exec tsx scripts/smoke-single-image-upgrade.ts
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file "$MCP_DEPLOY_DIR/runtime.env" -f deploy/compose.single-host.yml logs --no-color || true
      - name: Remove disposable deployment
        if: always()
        run: docker compose --env-file "$MCP_DEPLOY_DIR/runtime.env" -f deploy/compose.single-host.yml down -v

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mcp-ci
      COMPOSE_FILE: .github/compose.app-ci.yml
      FULL_REGRESSION: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # The runner registers this URL; the gateway resolves it inside Compose.
      REPORTS_UPSTREAM_URL: http://mcp-reports:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build unified application image
        run: docker compose build
      - name: Verify packaged frontend
        run: docker compose run --rm --no-deps --entrypoint test mcp-server -s /usr/share/nginx/html/index.html
      - name: Verify production Nginx routing and asset delivery
        run: pnpm exec tsx scripts/smoke-nginx.ts
      - name: Start dependencies and seed fixtures
        run: |
          docker compose up -d --wait postgres redis mcp-server mcp-a mcp-b mcp-reports mcp-knowledge
          DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp \
            CONFIG_FILE="$PWD/config/docker.json" \
            pnpm --filter @mcp/test-upstream seed --docker
      - name: Wait for application readiness
        run: |
          # Fixture seeding happens after startup; wait for the gateway registry to refresh too.
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/gateway/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp/demo > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Admin web, its API proxies or the seeded gateway route did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/api/internal/mcp-servers)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/gateway/mcp/demo)" = 404
      - name: Verify account lifecycle and last-administrator protection
        if: env.FULL_REGRESSION == 'true'
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-auth-lifecycle.ts
      - name: Verify admin workflows and shared system API keys
        if: env.FULL_REGRESSION == 'true'
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-admin-business.ts
      - name: Verify grouped upstream authentication, aggregation and migration
        if: env.FULL_REGRESSION == 'true'
        run: |
          DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-upstream-groups.ts
          DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp pnpm exec tsx scripts/smoke-upstream-migration.ts
      - name: Verify gateway OAuth, user access keys, public access and zero limits
        if: env.FULL_REGRESSION == 'true'
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-gateway-access.ts
      - name: Verify upstream OAuth lifecycle and revocation races
        if: env.FULL_REGRESSION == 'true'
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-oauth-lifecycle.ts
      - name: Verify credential validation, concurrent sessions, user quotas and recurring alerts
        if: env.FULL_REGRESSION == 'true'
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-gateway-reliability.ts
      # The broader smoke test deliberately exhausts /register's shared IP
      # limit. Run signup first so its OAuth client registration has quota.
      - name: Verify self-registration and default service grants
        if: env.FULL_REGRESSION == 'true'
        run: ADMIN_PASSWORD=admin123 SIGNUP_UPSTREAM_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}') pnpm exec tsx scripts/smoke-signup.ts
      - name: Verify call monitoring and collection switches
        if: env.FULL_REGRESSION == 'true'
        run: ADMIN_PASSWORD=admin123 DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 SIGNUP_UPSTREAM_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}') pnpm exec tsx scripts/smoke-monitoring.ts
      - name: Verify server edits, route renames and persisted permissions
        if: env.FULL_REGRESSION == 'true'
        run: pnpm exec tsx scripts/smoke-server-edit.ts
      - name: Verify grant revocation rejects live access tokens
        if: env.FULL_REGRESSION == 'true'
        run: ADMIN_PASSWORD=admin123 pnpm exec tsx scripts/smoke-grant-revocation.ts
      - name: Verify core login, MCP calls and access boundaries
        if: env.FULL_REGRESSION != 'true'
        run: pnpm smoke --core
      - name: Run full end-to-end regression against built images
        if: env.FULL_REGRESSION == 'true'
        run: pnpm smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop local services
        if: always()
        run: docker compose down -v

  release:
    name: Plan and trigger release
    needs: [verify, single-host, smoke]
    # Tags created with GITHUB_TOKEN do not trigger workflows, so the release
    # workflow is dispatched with the version this job computes.
    if: >-
      github.repository == 'BrandonVee/Mcp-Gateway' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    concurrency:
      group: mcp-release-plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the next release version
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs plan
      - name: Trigger the release workflow
        if: steps.plan.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -X POST \
            -f ref=main -f "inputs[tag]=$RELEASE_TAG" -f "inputs[ref]=$RELEASE_SHA" -f 'inputs[dry_run]=false'
          {
            echo "### Release dispatched"
            echo ""
            echo "$RELEASE_TAG for \`$RELEASE_SHA\` — [Release workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
