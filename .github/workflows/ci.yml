name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:admin

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build application images
        run: docker compose build
      - name: Verify packaged frontend
        run: docker compose run --rm --no-deps admin-web test -s /app/packages/admin-web/dist/index.html
      - name: Start dependencies and seed fixtures
        run: |
          docker compose up -d --wait postgres redis auth mcp-a mcp-b mcp-reports mcp-knowledge
          docker compose exec -T auth pnpm --filter @mcp/auth-server db:seed:dev --docker
      - name: Start gateway and admin web
        run: docker compose up -d --wait gateway admin-web
      - name: Run end-to-end smoke test against built images
        run: |
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:5173/gateway/health > /dev/null
          pnpm smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop local services
        if: always()
        run: docker compose down -v
