name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:admin

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mcp-ci
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml
      # The runner registers this URL; the gateway resolves it inside Compose.
      REPORTS_UPSTREAM_URL: http://mcp-reports:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build application images
        run: docker compose build
      - name: Verify packaged frontend
        run: docker compose run --rm --no-deps admin-web test -s /app/packages/admin-web/dist/index.html
      - name: Start dependencies and seed fixtures
        run: |
          docker compose up -d --wait postgres redis auth mcp-a mcp-b mcp-reports mcp-knowledge
          docker compose exec -T auth pnpm --filter @mcp/auth-server db:seed:dev --docker
      - name: Start gateway and admin web
        run: docker compose up -d --wait gateway admin-web
      - name: Run end-to-end smoke test against built images
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/gateway/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Admin web or its API proxies did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          pnpm smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop local services
        if: always()
        run: docker compose down -v
