name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:admin
      - run: pnpm build:runtime
      - run: pnpm audit --prod --audit-level high

  single-host:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mcp-setup-ci
      MCP_DEPLOY_DIR: /tmp/mcp-single-host
      MCP_HTTP_PORT: '18080'
      ADMIN_PASSWORD: ci-system-admin-password-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Deploy without a public URL or database configuration
        run: ./scripts/deploy.sh --yes
      - name: Verify setup, OAuth and persistent settings
        run: pnpm exec tsx scripts/smoke-system-settings.ts
      - name: Verify first-run browser database setup
        run: SETUP_TEST_IMAGE="mcp-app:$(git rev-parse --short=12 HEAD)" pnpm exec tsx scripts/smoke-web-setup.ts
      - name: Verify unified process lifecycle
        run: pnpm exec tsx scripts/smoke-app-lifecycle.ts
      - name: Rehearse backup and restore
        run: pnpm exec tsx scripts/smoke-backup.ts
      - name: Rehearse upgrade from split application containers
        run: pnpm exec tsx scripts/smoke-single-image-upgrade.ts
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file "$MCP_DEPLOY_DIR/runtime.env" -f deploy/compose.single-host.yml logs --no-color || true
      - name: Remove disposable deployment
        if: always()
        run: docker compose --env-file "$MCP_DEPLOY_DIR/runtime.env" -f deploy/compose.single-host.yml down -v

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mcp-ci
      COMPOSE_FILE: .github/compose.app-ci.yml
      # The runner registers this URL; the gateway resolves it inside Compose.
      REPORTS_UPSTREAM_URL: http://mcp-reports:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build unified application image
        run: docker compose build
      - name: Verify packaged frontend
        run: docker compose run --rm --no-deps --entrypoint test mcp-server -s /usr/share/nginx/html/index.html
      - name: Verify production Nginx routing and asset delivery
        run: pnpm exec tsx scripts/smoke-nginx.ts
      - name: Start dependencies and seed fixtures
        run: |
          docker compose up -d --wait postgres redis mcp-server mcp-a mcp-b mcp-reports mcp-knowledge
          DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp \
            CONFIG_FILE="$PWD/config/docker.json" \
            pnpm --filter @mcp/test-upstream seed --docker
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/gateway/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Admin web or its API proxies did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/api/internal/mcp-servers)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/gateway/mcp/demo)" = 404
      - name: Verify account lifecycle and last-administrator protection
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-auth-lifecycle.ts
      - name: Verify upstream OAuth lifecycle and revocation races
        run: DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 pnpm exec tsx scripts/smoke-oauth-lifecycle.ts
      # The broader smoke test deliberately exhausts /register's shared IP
      # limit. Run signup first so its OAuth client registration has quota.
      - name: Verify self-registration and default service grants
        run: ADMIN_PASSWORD=admin123 SIGNUP_UPSTREAM_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}') pnpm exec tsx scripts/smoke-signup.ts
      - name: Verify call monitoring and collection switches
        run: ADMIN_PASSWORD=admin123 DATABASE_URL=postgres://mcp:mcp-dev-password@127.0.0.1:5433/mcp REDIS_URL=redis://127.0.0.1:6380 SIGNUP_UPSTREAM_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}') pnpm exec tsx scripts/smoke-monitoring.ts
      - name: Verify server edits, route renames and persisted permissions
        run: pnpm exec tsx scripts/smoke-server-edit.ts
      - name: Run end-to-end smoke test against built images
        run: pnpm smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop local services
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image and GitHub release
    needs: [verify, single-host, smoke]
    if: >-
      github.repository == 'BrandonVee/Mcp-Gateway' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: dockerhub-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select a release version and prepare its bot commit
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs prepare
      - name: Check Docker Hub credential
        if: steps.version.outputs.released != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Add the DOCKERHUB_TOKEN repository secret with Docker Hub Read & Write permissions.'
            exit 1
          fi
      - name: Set up QEMU
        if: steps.version.outputs.released != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: steps.version.outputs.released != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        if: steps.version.outputs.released != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: brandonvee
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        if: steps.version.outputs.released != 'true'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: '12'
        with:
          images: brandonvee/mcp-gateway
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.short_sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.sha || github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version || github.ref_name }}
      - name: Build and publish unified application
        if: steps.version.outputs.released != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.production
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mcp-app-release
          cache-to: type=gha,mode=max,scope=mcp-app-release
          provenance: mode=min
          sbom: true
      - name: Inspect published manifest
        if: steps.version.outputs.released != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "brandonvee/mcp-gateway@$IMAGE_DIGEST"
          {
            echo '### Docker Hub image published'
            echo '- Repository: [brandonvee/mcp-gateway](https://hub.docker.com/r/brandonvee/mcp-gateway)'
            echo '- Platforms: linux/amd64, linux/arm64'
            echo "- Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sync Docker Hub startup guide
        if: github.ref == 'refs/heads/main' && steps.version.outputs.released != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/sync-dockerhub-description.mjs
      - name: Write release versions back to main as github-actions[bot]
        if: github.ref == 'refs/heads/main' && steps.version.outputs.released != 'true'
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: node scripts/github-release.mjs write-back
      - name: Publish GitHub Release as github-actions[bot]
        if: steps.version.outputs.released != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/github-release.mjs publish
