name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.2.3'
        required: true
        type: string
      ref:
        description: 'Commit or ref to publish; defaults to the tag, then the default branch'
        required: false
        type: string
      dry_run:
        description: 'Build and verify without pushing the image, creating the tag or the Release'
        required: false
        type: boolean
        default: false

concurrency:
  group: mcp-release${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release
    if: github.repository == 'BrandonVee/Mcp-Gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      released: ${{ steps.release.outputs.released }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - name: Checkout the commit to publish
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
          fetch-depth: 0
      # Tooling stays on the default branch so older tags can be re-released.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tooling
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the release commit
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .release-tooling/scripts/github-release.mjs resolve
      - name: Check Docker Hub credential
        if: steps.release.outputs.released != 'true' && inputs.dry_run != true
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Add the DOCKERHUB_TOKEN repository secret with Docker Hub Read & Write permissions.'
            exit 1
          fi

  build:
    name: Build image (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.released != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069f # v4
      - name: Log in to Docker Hub
        if: inputs.dry_run != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: brandonvee
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: brandonvee/mcp-gateway
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
      # Each architecture runs natively, including dependency installation.
      # Only digests are pushed here; release tags are written after both succeed.
      - name: Build native application image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.production
          target: app
          build-args: MCP_BUILD_VERSION=${{ needs.resolve.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ inputs.dry_run && 'type=cacheonly' || 'type=image,name=brandonvee/mcp-gateway,push-by-digest=true,name-canonical=true,push=true' }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mcp-app-release-${{ matrix.arch }}
          cache-to: ${{ inputs.dry_run != true && format('type=gha,mode=max,scope=mcp-app-release-{0}', matrix.arch) || '' }}
          provenance: mode=min
          sbom: true
      - name: Export image digest
        if: inputs.dry_run != true
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Build did not return a valid image digest.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/$IMAGE_ARCH"
      - name: Upload image digest
        if: inputs.dry_run != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    name: Publish manifest and release
    needs: [resolve, build]
    if: needs.resolve.outputs.released != 'true' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tooling
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download native image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069f # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: brandonvee
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check latest release eligibility
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" --jq .sha)"
          if [[ "$head_sha" == "$RELEASE_SHA" ]]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: brandonvee/mcp-gateway
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest == 'true' }}
            type=raw,value=${{ needs.resolve.outputs.short_sha }}
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=raw,value=${{ needs.resolve.outputs.version }}
      - name: Merge and publish the multi-platform manifest
        id: manifest
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid $arch image digest."
              exit 1
            fi
            sources+=("brandonvee/mcp-gateway@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(-t "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "brandonvee/mcp-gateway:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Published manifest has no valid digest.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Inspect published manifest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker buildx imagetools inspect "brandonvee/mcp-gateway@$IMAGE_DIGEST"
          docker buildx imagetools inspect "brandonvee/mcp-gateway@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          node --input-type=module - "$RUNNER_TEMP/manifest.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const index = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const platforms = new Set(index.manifests?.map(({ platform }) => `${platform?.os}/${platform?.architecture}`));
          for (const required of ['linux/amd64', 'linux/arm64']) {
            assert.ok(platforms.has(required), `Published manifest is missing ${required}`);
          }
          NODE
          {
            echo '### Docker Hub image published'
            echo '- Repository: [brandonvee/mcp-gateway](https://hub.docker.com/r/brandonvee/mcp-gateway)'
            echo '- Platforms: linux/amd64, linux/arm64'
            echo "- Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sync Docker Hub startup guide
        if: steps.latest.outputs.latest == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MCP_DOCKERHUB_DOC: ${{ github.workspace }}/docs/dockerhub.md
        run: node .release-tooling/scripts/sync-dockerhub-description.mjs
      - name: Create the Git tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          MAKE_LATEST: ${{ steps.latest.outputs.latest == 'true' && 'true' || 'legacy' }}
        run: node .release-tooling/scripts/github-release.mjs publish

  sync-version:
    name: Write release version back to main
    needs: [resolve, publish]
    # Published releases also reach this job when build/publish were skipped.
    if: >-
      always() && github.repository == 'BrandonVee/Mcp-Gateway' && inputs.dry_run != true &&
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.released == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: mcp-sync-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync product manifests as github-actions[bot]
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/github-release.mjs sync-version
