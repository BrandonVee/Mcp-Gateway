services:
  admin-web:
    build: .
    command: pnpm --filter @mcp/admin-web dev --host 0.0.0.0
    environment:
      ADMIN_API_TARGET: "http://auth:9001"
      GATEWAY_TARGET: "http://gateway:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./packages/admin-web/src:/app/packages/admin-web/src
      - ./packages/admin-web/index.html:/app/packages/admin-web/index.html
      - ./packages/admin-web/vite.config.ts:/app/packages/admin-web/vite.config.ts
    depends_on:
      auth:
        condition: service_started
      gateway:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  auth:
    build: .
    command: pnpm --filter @mcp/auth-server dev
    environment:
      PORT: "9001"
      AUTH_ISSUER: "http://localhost:9001"
      ACCESS_TOKEN_TTL: "604800"  # 7 days for static client config (demo)
      DB_PATH: "/data/auth.db"
      ADMIN_PASSWORD: "admin123"
      SEED_DEMO_USER: "1"
      ADMIN_WEB_URL: "http://localhost:5173"
    ports:
      - "9001:9001"
    volumes:
      - ./packages/auth-server/src:/app/packages/auth-server/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./data/auth:/data

  gateway:
    build: .
    command: pnpm --filter @mcp/gateway dev
    environment:
      PORT: "8000"
      REDIS_URL: "redis://redis:6379"
      AUTH_ISSUER: "http://localhost:9001"
      AUTH_JWKS_URL: "http://auth:9001/jwks.json"
      JWT_AUDIENCE: "mcp-gateway"
      RESOURCE_BASE_URL: "http://localhost:8000"
      GATEWAY_SERVERS: "demo|http://mcp-a:3001,http://mcp-b:3002"
    ports:
      - "8000:8000"
    volumes:
      - ./packages/gateway/src:/app/packages/gateway/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      mcp-a:
        condition: service_started
      mcp-b:
        condition: service_started

  mcp-a:
    build: .
    command: pnpm --filter @mcp/mcp-server dev
    environment:
      PORT: "3001"
      SERVER_NAME: "demo"
      INSTANCE_ID: "demo-a"
    ports:
      - "3001:3001"
    volumes:
      - ./packages/mcp-server/src:/app/packages/mcp-server/src
      - ./packages/shared/src:/app/packages/shared/src

  mcp-b:
    build: .
    command: pnpm --filter @mcp/mcp-server dev
    environment:
      PORT: "3002"
      SERVER_NAME: "demo"
      INSTANCE_ID: "demo-b"
    ports:
      - "3002:3002"
    volumes:
      - ./packages/mcp-server/src:/app/packages/mcp-server/src
      - ./packages/shared/src:/app/packages/shared/src
